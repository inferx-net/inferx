apiVersion: v1
kind: Secret
metadata:
  name: stripe-secrets
type: Opaque
stringData:
  # STRIPE_SECRET_KEY: from Stripe Dashboard → API keys (sk_live_... or sk_test_...)
  stripe-secret-key: "sk_live_REPLACE_WITH_YOUR_STRIPE_SECRET_KEY"
  # STRIPE_WEBHOOK_SECRET: from Stripe Dashboard → Webhooks → your endpoint → signing secret (whsec_...)
  stripe-webhook-secret: "whsec_REPLACE_WITH_YOUR_STRIPE_WEBHOOK_SECRET"
